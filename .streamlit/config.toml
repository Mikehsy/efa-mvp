[server]
headless = true
port = 8501
# 不写死 address：本机由启动脚本用 --server.address 指定，云端由平台接管。
maxUploadSize = 5
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# 生产不向浏览器暴露异常堆栈；完整堆栈写入 logs/app.log。
# 开发调试时可临时改为 true。
showErrorDetails = false

# CALIBER 设计系统（见项目根 DESIGN.md）
[theme]
primaryColor = "#18A58B"
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#EEF3F7"
textColor = "#102336"
font = "sans serif"
