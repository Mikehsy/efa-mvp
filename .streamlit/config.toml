[server]
headless = true
port = 8501
# 不写死 address：本机由启动脚本用 --server.address 指定，云端由平台接管。
maxUploadSize = 5
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# 生产不向浏览器暴露异常堆栈；完整堆栈写入 logs/app.log。
# 开发调试时可临时改为 true。
showErrorDetails = false

[theme]
primaryColor = "#1e5b98"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7fafd"
textColor = "#1a2b42"
font = "sans serif"
